name: 缺陷报告
description: 报告运行缺陷或源码静态发现，给出复现、版本与修复验收条件。
title: '[缺陷] '
labels:
- bug
body:
- type: markdown
  attributes:
    value: |-
      创建后自动添加 `bug` 标签。静态发现也可以提交；请明确区分源码推断、旧工程线索与当前工程实际复现。

      优先级、模块和里程碑字段记录建议归属，创建后由维护者设置对应标签和里程碑。
      需要运行验收或实验数据时，按实际任务添加 `needs:runtime-verification` 或 `needs:experiment-evidence`。

      [项目范围](https://github.com/YYchainsAw/AesirWarden/blob/main/Docs/01_Project_Overview/02_GoalsAndScope.md) · [已知问题](https://github.com/YYchainsAw/AesirWarden/blob/main/Docs/06_Test_Doc/KnownIssues.md) · [里程碑](https://github.com/YYchainsAw/AesirWarden/milestones)
- type: textarea
  id: summary
  attributes:
    label: 问题与影响
    description: 描述触发条件、异常行为以及影响的玩法、实验或交付。
    placeholder: |-
      发生什么：
      触发条件：
      影响范围：
  validations:
    required: true
- type: dropdown
  id: basis
  attributes:
    label: 当前依据
    description: 选择目前已经取得的证据。
    options:
    - 当前工程运行已复现
    - 当前源码/资产静态发现，运行复现待执行
    - 外部或旧工程线索，当前工程待核对
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 版本与环境
    description: 记录能够定位问题的版本；尚未确认的内容写待确认。静态发现填写源码 commit 和路径即可。
    placeholder: |-
      UE 版本 / commit：
      源码或资产路径 / 地图：
      PIE 或 Windows 包 / 构建配置 / 设备：
      BT、PPO 或回退模式（如涉及）：
      服务版本、模型 SHA、Schema（如涉及）：
  validations:
    required: true
- type: dropdown
  id: priority
  attributes:
    label: 建议优先级
    description: 根据当前验收范围选择；尚未确定时选待确认。
    options:
    - P0 — 当前验收必需（priority:p0）
    - P1 — P0 稳定后的演示完善（priority:p1）
    - 后续 — 当前验收之外（priority:later）
    - 待确认
  validations:
    required: true
- type: dropdown
  id: areas
  attributes:
    label: 影响模块
    description: 通常选择 1–2 个主要模块；必要时可多选。
    multiple: true
    options:
    - area:combat — 战斗规则、命中、防御与锁定
    - area:gas — 能力、属性、效果与伤害结算
    - area:player — 玩家、移动、输入与相机
    - area:boss-ai — 行为树、共享执行器与回退
    - area:boss-rl — 观测、策略、奖励、遥测与评估
    - area:companion — 同伴与战术订单
    - area:services — UE 侧 HTTP/JSON 与外部服务集成
    - area:animation — 动画、Montage 与通知
    - area:ui — HUD、菜单与结果界面
    - area:level-flow — 第一关、Boss 遭遇、结算与重试
    - area:build — 工程配置、编译、Cook 与 Windows 包
    - area:assets — 许可、公开范围、依赖恢复与快照
    - 文档、跨模块或待确认（在正文说明）
  validations:
    required: true
- type: dropdown
  id: milestone
  attributes:
    label: 建议里程碑
    description: 后续范围可以不归属当前三个里程碑；实际归属由维护者设置。
    options:
    - M1 · P0 单 Boss 可运行闭环与 Windows 基线包
    - M2 · P0 BT–PPO 可复现对照与研究证据
    - M3 · P1 第一关完整表现与 Windows 演示交付
    - 后续 / 暂不归属
    - 待确认
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: 复现步骤或待验证路径
    description: 已复现时写实际步骤与频率；静态发现时写源码位置、判断依据及拟执行步骤，并注明未运行。
    placeholder: |-
      1. 初始状态与配置
      2. 操作或故障注入
      3. 观察异常
      复现频率 / 是否实际运行：
  validations:
    required: true
- type: textarea
  id: expected_actual
  attributes:
    label: 预期与实际行为
    description: 实际运行结果与静态推断分别注明，不把待测试结果写成已发生事实。
    placeholder: |-
      预期：
      实际观察或静态推断：
      关联请求 / Episode / 日志：
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 修复完成条件
    description: 写出修复后可检查的行为和回归要求；关闭时关联实际证据。
    placeholder: |-
      - [ ] 原触发路径得到验证
      - [ ] 相关正常路径和故障路径通过回归
      - [ ] 保存对应版本的日志/录屏/遥测，更新验证记录
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: 已有证据与附件
    description: 填写日志、录屏、请求/响应、遥测或报告链接，可拖入附件；本地文件写明路径和保管位置。尚无证据可留空。
    placeholder: |-
      证据路径/链接：
      对应 commit、构建或文件哈希：
      执行时间与实际结果：
  validations:
    required: false
- type: textarea
  id: related
  attributes:
    label: 关联问题与依赖
    description: 可填写 Issue/PR、KI-xx、验证项 ID、设计文档和前置任务。
    placeholder: '例如：KI-01、RL-FAULT-01；依赖 #...；相关文档/源码路径...'
  validations:
    required: false
