name: 功能需求
description: 描述新增或完善功能的目标、范围、接口影响和可验证的完成条件。
title: '[功能] '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: |-
      创建后自动添加 `enhancement` 标签。按当前 P0/P1/后续范围说明需求；菜单/开场已有 C++ 的任务应写清接入和待验证部分。

      优先级、模块和里程碑字段记录建议归属，创建后由维护者设置对应标签和里程碑。
      需要运行验收或实验数据时，按实际任务添加 `needs:runtime-verification` 或 `needs:experiment-evidence`。

      [项目范围](https://github.com/YYchainsAw/AesirWarden/blob/main/Docs/01_Project_Overview/02_GoalsAndScope.md) · [已知问题](https://github.com/YYchainsAw/AesirWarden/blob/main/Docs/06_Test_Doc/KnownIssues.md) · [里程碑](https://github.com/YYchainsAw/AesirWarden/milestones)
- type: textarea
  id: goal
  attributes:
    label: 目标与使用场景
    description: 描述玩家、开发者或研究流程在何种场景下需要什么行为。
    placeholder: |-
      触发场景：
      目标行为：
      解决的问题：
  validations:
    required: true
- type: textarea
  id: current
  attributes:
    label: 当前实现与缺口
    description: 引用现有源码、资产或设计；说明已存在、待接入及待验证的部分。
    placeholder: |-
      现有实现 / commit / 文档路径：
      已有运行证据（如有）：
      尚需完成：
  validations:
    required: true
- type: dropdown
  id: priority
  attributes:
    label: 建议优先级
    description: 根据当前验收范围选择；尚未确定时选待确认。
    options:
    - P0 — 当前验收必需（priority:p0）
    - P1 — P0 稳定后的演示完善（priority:p1）
    - 后续 — 当前验收之外（priority:later）
    - 待确认
  validations:
    required: true
- type: dropdown
  id: areas
  attributes:
    label: 影响模块
    description: 通常选择 1–2 个主要模块；必要时可多选。
    multiple: true
    options:
    - area:combat — 战斗规则、命中、防御与锁定
    - area:gas — 能力、属性、效果与伤害结算
    - area:player — 玩家、移动、输入与相机
    - area:boss-ai — 行为树、共享执行器与回退
    - area:boss-rl — 观测、策略、奖励、遥测与评估
    - area:companion — 同伴与战术订单
    - area:services — UE 侧 HTTP/JSON 与外部服务集成
    - area:animation — 动画、Montage 与通知
    - area:ui — HUD、菜单与结果界面
    - area:level-flow — 第一关、Boss 遭遇、结算与重试
    - area:build — 工程配置、编译、Cook 与 Windows 包
    - area:assets — 许可、公开范围、依赖恢复与快照
    - 文档、跨模块或待确认（在正文说明）
  validations:
    required: true
- type: dropdown
  id: milestone
  attributes:
    label: 建议里程碑
    description: 后续范围可以不归属当前三个里程碑；实际归属由维护者设置。
    options:
    - M1 · P0 单 Boss 可运行闭环与 Windows 基线包
    - M2 · P0 BT–PPO 可复现对照与研究证据
    - M3 · P1 第一关完整表现与 Windows 演示交付
    - 后续 / 暂不归属
    - 待确认
  validations:
    required: true
- type: textarea
  id: design
  attributes:
    label: 实现范围与接口影响
    description: 列出拟修改的模块、Blueprint/GAS/服务契约及依赖；未确定的方案注明待定。
    placeholder: |-
      本任务范围：
      接口 / 状态 / 数据版本影响：
      需要配置的资产或场景引用：
      依赖与回退方式：
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: 功能完成条件
    description: 使用可以实际检查的行为；关卡流程任务明确输入、相机、Episode、重试和清理要求。
    placeholder: |-
      - [ ] 在指定触发条件下产生预期行为
      - [ ] 重复触发、失败和清理路径符合约定
      - [ ] 完成指定验收并关联证据
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: 验证方法与证据计划
    description: 说明如何检查每条完成条件；PIE、Windows 包和正式实验分别列出。
    placeholder: |-
      验证环境与步骤：
      正常 / 异常 / 回归路径：
      需要保存的日志、录像或遥测：
  validations:
    required: true
- type: textarea
  id: related
  attributes:
    label: 关联问题与依赖
    description: 可填写 Issue/PR、KI-xx、验证项 ID、设计文档和前置任务。
    placeholder: '例如：KI-01、RL-FAULT-01；依赖 #...；相关文档/源码路径...'
  validations:
    required: false
- type: textarea
  id: evidence
  attributes:
    label: 已有证据与附件
    description: 填写日志、录屏、请求/响应、遥测或报告链接，可拖入附件；本地文件写明路径和保管位置。尚无证据可留空。
    placeholder: |-
      证据路径/链接：
      对应 commit、构建或文件哈希：
      执行时间与实际结果：
  validations:
    required: false
